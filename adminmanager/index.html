<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rynkar Games | Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px border rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Login Section -->
    <div id="login-section" class="w-full max-w-md glass p-8 rounded-2xl shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">Admin Girişi</h1>
            <p class="text-slate-400 mt-2">Devam etmek için kimlik bilgilerinizi girin.</p>
        </div>
        <form id="login-form" class="space-y-6">
            <div>
                <label class="block text-sm font-medium mb-2">Kullanıcı Adı</label>
                <input type="text" id="username" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">Şifre</label>
                <input type="password" id="password" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition-all transform hover:scale-[1.02]">Giriş Yap</button>
        </form>
    </div>

    <!-- Admin Panel Section (Hidden by default) -->
    <div id="admin-section" class="hidden w-full max-w-5xl space-y-8 py-12">
        <div class="flex items-center justify-between glass p-6 rounded-2xl">
            <h2 class="text-2xl font-bold flex items-center gap-3">
                <i class="fas fa-user-shield text-indigo-500"></i>
                Rynkar Games Yönetim Paneli
            </h2>
            <button id="logout-btn" class="px-4 py-2 text-sm bg-slate-800 hover:bg-red-900/30 text-red-400 rounded-lg border border-red-900/50 transition-all">Güvenli Çıkış</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Navigation Tabs -->
            <div class="lg:col-span-1 space-y-4">
                <button onclick="showTab('general')" class="tab-btn w-full text-left glass p-4 rounded-xl border-l-4 border-indigo-500 font-bold flex items-center gap-3 transition-all">
                    <i class="fas fa-cog"></i> Genel Ayarlar
                </button>
                <button onclick="showTab('games')" class="tab-btn w-full text-left glass p-4 rounded-xl border-l-4 border-transparent hover:border-indigo-500/50 flex items-center gap-3 transition-all">
                    <i class="fas fa-gamepad"></i> Oyun Yönetimi
                </button>
                <button onclick="showTab('social')" class="tab-btn w-full text-left glass p-4 rounded-xl border-l-4 border-transparent hover:border-indigo-500/50 flex items-center gap-3 transition-all">
                    <i class="fas fa-share-alt"></i> Sosyal Medya
                </button>
                <button onclick="showTab('colors')" class="tab-btn w-full text-left glass p-4 rounded-xl border-l-4 border-transparent hover:border-indigo-500/50 flex items-center gap-3 transition-all">
                    <i class="fas fa-palette"></i> Renk Ayarları
                </button>
                <div class="pt-8">
                    <button id="save-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-indigo-900/20 transition-all transform hover:scale-105 mb-4">
                        <i class="fas fa-save"></i> Değişiklikleri Kaydet
                    </button>
                    <p class="text-[10px] text-slate-500 mt-2 text-center">Bu işlem sonucunda güncel <strong>content.json</strong> dosyasını indirebilirsiniz.</p>
                </div>
            </div>

            <!-- Content Area -->
            <div class="lg:col-span-2">
                <div id="general-tab" class="tab-content glass p-8 rounded-2xl space-y-6">
                    <h3 class="text-xl font-bold mb-4">Genel Bilgiler</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-slate-400 mb-1">Site Başlığı (Logo)</label>
                            <input type="text" id="edit-logo" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-400 mb-1">Hero Başlık</label>
                            <input type="text" id="edit-hero-title" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-400 mb-1">Hero Arkaplan Resmi (URL)</label>
                            <input type="text" id="edit-hero-bg" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2" placeholder="https://example.com/image.jpg">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-400 mb-1">Hero Açıklama</label>
                            <textarea id="edit-hero-desc" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm text-slate-400 mb-1">Hakkımızda Başlık</label>
                            <input type="text" id="edit-about-title" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-400 mb-1">Hakkımızda Açıklama</label>
                            <textarea id="edit-about-desc" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm text-slate-400 mb-1">İletişim E-posta</label>
                            <input type="text" id="edit-contact-email" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2">
                        </div>
                    </div>
                </div>

                <div id="games-tab" class="tab-content hidden glass p-8 rounded-2xl space-y-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xl font-bold">Oyun Kartları</h3>
                        <button onclick="addGameRow()" class="px-4 py-2 bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 rounded-lg text-sm hover:bg-indigo-600/40 transition-all">+ Yeni Oyun</button>
                    </div>
                    <div id="games-list" class="space-y-6">
                        <!-- Game edit rows will be here -->
                    </div>
                </div>

                <div id="social-tab" class="tab-content hidden glass p-8 rounded-2xl space-y-6">
                    <h3 class="text-xl font-bold mb-4">Sosyal Medya Linkleri</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-slate-400 mb-1">Google Play Geliştirici Sayfası</label>
                            <input type="text" id="edit-social-gplay" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-400 mb-1">Instagram</label>
                            <input type="text" id="edit-social-instagram" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-400 mb-1">YouTube</label>
                            <input type="text" id="edit-social-youtube" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2">
                        </div>
                    </div>
                </div>

                <div id="colors-tab" class="tab-content hidden glass p-8 rounded-2xl space-y-6">
                    <h3 class="text-xl font-bold mb-4">Renk Paleti</h3>
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm text-slate-400 mb-2">Ana Renk (Primary)</label>
                            <div class="flex gap-2">
                                <input type="color" id="edit-color-primary" class="h-10 w-20 bg-transparent cursor-pointer">
                                <input type="text" id="edit-color-primary-hex" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 uppercase">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm text-slate-400 mb-2">İkincil Renk (Secondary)</label>
                            <div class="flex gap-2">
                                <input type="color" id="edit-color-secondary" class="h-10 w-20 bg-transparent cursor-pointer">
                                <input type="text" id="edit-color-secondary-hex" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 uppercase">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const AUTH_USER = 'admin';
        const AUTH_PASS = 'Rynkar98!';
        let contentData = null;

        // Login Logic
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if (u === AUTH_USER && p === AUTH_PASS) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-section').classList.remove('hidden');
                document.body.classList.remove('items-center', 'justify-center');
                loadContentData();
            } else {
                alert('Hatalı kullanıcı adı veya şifre!');
            }
        });

        // Tab Management
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.getElementById(tabId + '-tab').classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('border-indigo-500');
                b.classList.add('border-transparent');
                b.classList.remove('font-bold');
            });
            event.currentTarget.classList.remove('border-transparent');
            event.currentTarget.classList.add('border-indigo-500', 'font-bold');
        }

        // Data Loading
        async function loadContentData() {
            try {
                const response = await fetch('../content.json');
                contentData = await response.json();

                // Fill General
                document.getElementById('edit-logo').value = contentData.siteSettings.logo;
                document.getElementById('edit-hero-title').value = contentData.hero.title;
                document.getElementById('edit-hero-bg').value = contentData.hero.backgroundImage;
                document.getElementById('edit-hero-desc').value = contentData.hero.description;
                document.getElementById('edit-about-title').value = contentData.about.title;
                document.getElementById('edit-about-desc').value = contentData.about.description;
                document.getElementById('edit-contact-email').value = contentData.siteSettings.contactEmail;

                // Fill Social
                document.getElementById('edit-social-gplay').value = contentData.siteSettings.socialLinks.googlePlay;
                document.getElementById('edit-social-instagram').value = contentData.siteSettings.socialLinks.instagram;
                document.getElementById('edit-social-youtube').value = contentData.siteSettings.socialLinks.youtube;

                // Fill Colors
                document.getElementById('edit-color-primary').value = contentData.siteSettings.primaryColor;
                document.getElementById('edit-color-primary-hex').value = contentData.siteSettings.primaryColor;
                document.getElementById('edit-color-secondary').value = contentData.siteSettings.secondaryColor;
                document.getElementById('edit-color-secondary-hex').value = contentData.siteSettings.secondaryColor;

                // Fill Games
                const list = document.getElementById('games-list');
                list.innerHTML = '';
                contentData.games.forEach(game => {
                    addGameRow(game.title, game.category, game.description, game.image, game.video, game.youtubeId, game.links.googlePlay, game.links.appStore);
                });

            } catch (err) {
                console.error('Veri yüklenemedi:', err);
                alert('content.json dosyası okunamadı.');
            }
        }

        function addGameRow(title = '', category = '', desc = '', image = '', video = '', youtubeId = '', gplay = '', apple = '') {
            const div = document.createElement('div');
            div.className = 'game-item glass p-4 rounded-xl space-y-3 relative border border-slate-700';
            div.innerHTML = `
                <button onclick="this.parentElement.remove()" class="absolute top-4 right-4 text-red-500 hover:text-red-400"><i class="fas fa-trash"></i></button>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] text-slate-500 mb-1 uppercase font-bold">Oyun Adı</label>
                        <input type="text" value="${title}" class="g-title w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-500 mb-1 uppercase font-bold">Kategori</label>
                        <input type="text" value="${category}" class="g-category w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-[10px] text-slate-500 mb-1 uppercase font-bold">Görsel URL</label>
                        <input type="text" value="${image}" class="g-image w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-500 mb-1 uppercase font-bold">Video URL (.mp4)</label>
                        <input type="text" value="${video}" class="g-video w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-500 mb-1 uppercase font-bold">YouTube ID (Örn: dQw4w9WgXcQ)</label>
                        <input type="text" value="${youtubeId}" class="g-youtube w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] text-slate-500 mb-1 uppercase font-bold">Google Play Link</label>
                        <input type="text" value="${gplay}" class="g-gplay w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-500 mb-1 uppercase font-bold">App Store Link</label>
                        <input type="text" value="${apple}" class="g-apple w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] text-slate-500 mb-1 uppercase font-bold">Açıklama</label>
                    <textarea class="g-desc w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm" rows="2">${desc}</textarea>
                </div>
            `;
            document.getElementById('games-list').appendChild(div);
        }

        // Color Sync
        document.getElementById('edit-color-primary').addEventListener('input', e => document.getElementById('edit-color-primary-hex').value = e.target.value);
        document.getElementById('edit-color-secondary').addEventListener('input', e => document.getElementById('edit-color-secondary-hex').value = e.target.value);

        // Save Logic
        document.getElementById('save-btn').addEventListener('click', async () => {
            const updatedData = {
                siteSettings: {
                    logo: document.getElementById('edit-logo').value,
                    primaryColor: document.getElementById('edit-color-primary-hex').value,
                    secondaryColor: document.getElementById('edit-color-secondary-hex').value,
                    contactEmail: document.getElementById('edit-contact-email').value,
                    socialLinks: {
                        googlePlay: document.getElementById('edit-social-gplay').value,
                        instagram: document.getElementById('edit-social-instagram').value,
                        youtube: document.getElementById('edit-social-youtube').value
                    }
                },
                hero: {
                    title: document.getElementById('edit-hero-title').value,
                    description: document.getElementById('edit-hero-desc').value,
                    backgroundImage: document.getElementById('edit-hero-bg').value
                },
                about: {
                    title: document.getElementById('edit-about-title').value,
                    description: document.getElementById('edit-about-desc').value
                },
                games: []
            };

            document.querySelectorAll('.game-item').forEach((item, index) => {
                updatedData.games.push({
                    id: index + 1,
                    title: item.querySelector('.g-title').value,
                    category: item.querySelector('.g-category').value,
                    description: item.querySelector('.g-desc').value,
                    image: item.querySelector('.g-image').value,
                    video: item.querySelector('.g-video').value,
                    youtubeId: item.querySelector('.g-youtube').value,
                    links: {
                        googlePlay: item.querySelector('.g-gplay').value,
                        appStore: item.querySelector('.g-apple').value
                    }
                });
            });

            const jsonStr = JSON.stringify(updatedData, null, 2);
            
            try {
                // Try direct save if endpoint exists
                const response = await fetch('/save-content', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: jsonStr
                });

                if (response.ok) {
                    alert('Değişiklikler başarıyla kaydedildi!');
                } else {
                    throw new Error('Save endpoint not available');
                }
            } catch (err) {
                // Fallback to download
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const anchor = document.createElement('a');
                anchor.download = 'content.json';
                anchor.href = window.URL.createObjectURL(blob);
                anchor.click();
                alert('Değişiklikler uygulandı. Lütfen indirilen content.json dosyasını mevcut olanla değiştirin.');
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => location.reload());
    </script>
</body>
</html>
